name: Rakmyat CI and image release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rakmyat-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # PR and manual validation are deliberately noindex. A main release must set
  # explicit repository variables and pass the production-indexing approval check.
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://rakmyat.online' }}
  ROBOTS_INDEXING_ENABLED: ${{ vars.ROBOTS_INDEXING_ENABLED || 'false' }}
  NEXT_DEPLOYMENT_ID: ${{ github.sha }}

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Validate release build settings
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RELEASE_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          RELEASE_ROBOTS_INDEXING_ENABLED: ${{ vars.ROBOTS_INDEXING_ENABLED }}
          INDEXING_APPROVED: ${{ vars.INDEXING_APPROVED }}
        run: |
          set -eu
          case "$RELEASE_SITE_URL" in
            https://rakmyat.online|https://rakmyat.online/) ;;
            *) echo "Set NEXT_PUBLIC_SITE_URL explicitly to the approved production origin." >&2; exit 1 ;;
          esac
          if [ "$RELEASE_ROBOTS_INDEXING_ENABLED" != "true" ]; then
            echo "Production releases require ROBOTS_INDEXING_ENABLED=true; noindex remains the safe PR/staging default." >&2
            exit 1
          fi
          if [ "$INDEXING_APPROVED" != "true" ]; then
            echo "Set INDEXING_APPROVED=true only after the site owner confirms production indexing." >&2
            exit 1
          fi

      - name: Build Next.js production application
        run: npm run build

      - name: Validate production Compose configuration
        run: docker compose --env-file deployment/production.env.example -f docker-compose.production.yml -f docker-compose.production.override.yml config --quiet

  responsive:
    name: Responsive tests (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps "${{ matrix.browser }}"

      - name: Run responsive suite
        run: npm run responsive:e2e -- --project="${{ matrix.browser }}"
        env:
          CI: 'true'
          RESPONSIVE_BASE_URL: http://127.0.0.1:5175

      - name: Upload Playwright HTML report and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: responsive-${{ matrix.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  docker-validation:
    name: Production image and isolated integration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build production image for Linux AMD64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          tags: rakmyat-ci:${{ github.sha }}
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/rakmyat-image.tar
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ env.NEXT_PUBLIC_SITE_URL }}
            ROBOTS_INDEXING_ENABLED=${{ env.ROBOTS_INDEXING_ENABLED }}
            NEXT_DEPLOYMENT_ID=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Load and verify candidate image metadata
        id: candidate
        env:
          LOCAL_IMAGE: rakmyat-ci:${{ github.sha }}
        run: |
          set -eu
          docker load --input "$RUNNER_TEMP/rakmyat-image.tar"
          architecture="$(docker image inspect "$LOCAL_IMAGE" --format '{{.Architecture}}')"
          revision="$(docker image inspect "$LOCAL_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          user="$(docker image inspect "$LOCAL_IMAGE" --format '{{.Config.User}}')"
          if [ "$architecture" != amd64 ] || [ "$revision" != "$GITHUB_SHA" ] || [ "$user" != nextjs ]; then
            echo "Image verification failed: arch=$architecture revision=$revision user=$user" >&2
            exit 1
          fi
          printf 'image=%s\n' "$LOCAL_IMAGE" >> "$GITHUB_OUTPUT"
          cat > "$RUNNER_TEMP/rakmyat-image-build-metadata.json" <<EOF
          {"repository":"$GITHUB_REPOSITORY","revision":"$GITHUB_SHA","architecture":"$architecture","runtime_user":"$user","site_url":"$NEXT_PUBLIC_SITE_URL","robots_indexing_enabled":"$ROBOTS_INDEXING_ENABLED"}
          EOF

      - name: Create disposable integration secrets
        run: |
          set -eu
          umask 077
          mkdir -p .phase43-secrets
          db_password="$(openssl rand -hex 24)"
          printf '%s' "$db_password" > .phase43-secrets/postgres_password
          printf 'postgres://rakmyat_staging:%s@postgres:5432/rakmyat_phase43' "$db_password" > .phase43-secrets/database_url
          openssl rand -hex 32 > .phase43-secrets/rate_limit_secret
          printf '%s' 'mailpit-ci-only' > .phase43-secrets/mailpit_smtp_password
          openssl rand -hex 32 > .phase43-secrets/outbox_worker_secret
          # File-backed Compose secrets are bind-mounted; the app runs as UID 10001.
          chmod 0444 .phase43-secrets/*

      - name: Install Chromium for backend browser tests
        run: npx playwright install --with-deps chromium

      - name: Run image against unique disposable integration stack
        env:
          COMPOSE_PROJECT_NAME: rakmyat-ci-${{ github.run_id }}-${{ github.run_attempt }}
          RAKMYAT_CI_IMAGE: rakmyat-ci:${{ github.sha }}
          PHASE43_BASE_URL: http://127.0.0.1:5212
        run: |
          set -eu
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.phase-4.3.yml up --detach --no-build --wait --wait-timeout 300
          test "$(docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.phase-4.3.yml exec -T web id -u)" = 10001
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.phase-4.3.yml exec -T web node -e 'for (const key of ["DATABASE_URL", "RATE_LIMIT_SECRET", "OUTBOX_WORKER_SECRET"]) if (!process.env[key]) throw Error(`${key} was not loaded`); for (const key of ["DATABASE_URL_FILE", "RATE_LIMIT_SECRET_FILE", "OUTBOX_WORKER_SECRET_FILE"]) if (process.env[key]) throw Error(`${key} file path was not cleared`); console.log("runtime secret-file loading: passed (values not displayed)")'
          node -e 'fetch(process.env.PHASE43_BASE_URL + "/api/health").then(async r => { if (!r.ok) throw Error(`health returned ${r.status}`); console.log("web health: " + r.status); }).catch(e => { console.error(e); process.exit(1); })'
          npm run phase43:e2e

      - name: Check worker health
        env:
          COMPOSE_PROJECT_NAME: rakmyat-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -eu
          worker="$(docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.phase-4.3.yml ps -q email-worker)"
          test -n "$worker"
          health="$(docker inspect "$worker" --format '{{.State.Health.Status}}')"
          test "$health" = healthy
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.phase-4.3.yml exec -T email-worker node -e 'if (!process.env.OUTBOX_WORKER_SECRET || process.env.OUTBOX_WORKER_SECRET_FILE) process.exit(1); console.log("worker secret-file loading: passed (value not displayed)")'

      - name: Collect integration diagnostics before cleanup
        if: failure()
        env:
          COMPOSE_PROJECT_NAME: rakmyat-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$RUNNER_TEMP/rakmyat-integration-diagnostics"
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.phase-4.3.yml ps --all > "$RUNNER_TEMP/rakmyat-integration-diagnostics/compose-ps.txt" 2>&1 || true
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.phase-4.3.yml logs --no-color > "$RUNNER_TEMP/rakmyat-integration-diagnostics/compose-logs.txt" 2>&1 || true

      - name: Stop only this run's disposable stack
        if: always()
        env:
          COMPOSE_PROJECT_NAME: rakmyat-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.phase-4.3.yml down --volumes --remove-orphans

      - name: Upload tested image and build metadata for main release
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image-${{ github.sha }}
          path: |
            ${{ runner.temp }}/rakmyat-image.tar
            ${{ runner.temp }}/rakmyat-image-build-metadata.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload integration failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rakmyat-integration-diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Validate production Compose configuration
        run: docker compose --env-file deployment/production.env.example -f docker-compose.production.yml -f docker-compose.production.override.yml config --quiet

  publish-image:
    name: Publish tested immutable production image
    needs: [validate, responsive, docker-validation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: rakmyat-production-image
      cancel-in-progress: false
    outputs:
      image_digest: ${{ steps.publish.outputs.image_digest }}
    steps:
      - name: Download tested image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-image-${{ github.sha }}
          path: ${{ runner.temp }}/tested-image

      - name: Load exact image validated by CI
        run: docker load --input "$RUNNER_TEMP/tested-image/rakmyat-image.tar"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an existing SHA tag and publish tested image
        id: publish
        env:
          LOCAL_IMAGE: rakmyat-ci:${{ github.sha }}
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if docker manifest inspect "$image:$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing immutable release tag $image:$GITHUB_SHA" >&2
            exit 1
          fi
          docker image tag "$LOCAL_IMAGE" "$image:$GITHUB_SHA"
          push_output="$(docker push "$image:$GITHUB_SHA" 2>&1)" || { printf '%s\n' "$push_output"; exit 1; }
          printf '%s\n' "$push_output"
          digest="$(printf '%s\n' "$push_output" | sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' | tail -n 1)"
          if [ -z "$digest" ]; then echo "Registry did not return an image digest." >&2; exit 1; fi
          docker pull "$image@$digest"
          remote_revision="$(docker image inspect "$image@$digest" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          remote_arch="$(docker image inspect "$image@$digest" --format '{{.Architecture}}')"
          if [ "$remote_revision" != "$GITHUB_SHA" ] || [ "$remote_arch" != amd64 ]; then
            echo "Published manifest verification failed: revision=$remote_revision architecture=$remote_arch" >&2
            exit 1
          fi
          printf 'image_digest=%s@%s\n' "$image" "$digest" >> "$GITHUB_OUTPUT"
          cat > "$RUNNER_TEMP/rakmyat-release-metadata.json" <<EOF
          {"repository":"$GITHUB_REPOSITORY","revision":"$GITHUB_SHA","image":"$image","tag":"$GITHUB_SHA","digest":"$digest","architecture":"$remote_arch","source":"https://github.com/$GITHUB_REPOSITORY"}
          EOF
          {
            echo '### Published Rakmyat image'
            echo
            echo "- Revision: `$GITHUB_SHA`"
            echo "- Immutable tag: `$image:$GITHUB_SHA`"
            echo "- Deployment reference: `$image@$digest`"
            echo "- Architecture: `$remote_arch`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metadata-${{ github.sha }}
          path: ${{ runner.temp }}/rakmyat-release-metadata.json
          if-no-files-found: error
          retention-days: 90

  deploy-production:
    name: Blue-green deploy to VPS
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://rakmyat.online
    permissions:
      contents: read
      packages: read
    concurrency:
      group: rakmyat-production-deploy
      cancel-in-progress: false
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned VPS SSH credentials
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -eu
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/rakmyat_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/rakmyat_deploy" "$HOME/.ssh/known_hosts"

      - name: Upload Compose release configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -eu
          ssh -i "$HOME/.ssh/rakmyat_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "mkdir -p /opt/rakmyat/deployment /opt/rakmyat/docker/production"
          scp -i "$HOME/.ssh/rakmyat_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            docker-compose.production.yml "$VPS_USER@$VPS_HOST:/opt/rakmyat/docker-compose.production.yml"
          scp -i "$HOME/.ssh/rakmyat_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            docker-compose.production.override.yml "$VPS_USER@$VPS_HOST:/opt/rakmyat/docker-compose.production.override.yml"
          scp -i "$HOME/.ssh/rakmyat_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            docker/production/10-create-roles.sh "$VPS_USER@$VPS_HOST:/opt/rakmyat/docker/production/10-create-roles.sh"

      - name: Deploy immutable image digest and switch nginx upstream
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_DIGEST: ${{ needs.publish-image.outputs.image_digest }}
        run: |
          set -eu
          ssh -i "$HOME/.ssh/rakmyat_deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" "sudo -n /usr/local/sbin/rakmyat-deploy '$IMAGE_DIGEST'"
