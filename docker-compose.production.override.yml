name: rakmyat-production

# Host-installed nginx owns public ports 80/443. Preserve the VPS uploads
# directory already used by production when either app slot is replaced.
services:
  web-blue:
    volumes:
      - /home/rakmyat/data/uploads:/data/uploads
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=96m"
      - "/app/.next/cache:rw,noexec,nosuid,size=256m,uid=10001,gid=10001"
      - "/app/.next/server/route-cache:rw,noexec,nosuid,size=64m,uid=10001,gid=10001"
  web-green:
    volumes:
      - /home/rakmyat/data/uploads:/data/uploads
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=96m"
      - "/app/.next/cache:rw,noexec,nosuid,size=256m,uid=10001,gid=10001"
      - "/app/.next/server/route-cache:rw,noexec,nosuid,size=64m,uid=10001,gid=10001"
