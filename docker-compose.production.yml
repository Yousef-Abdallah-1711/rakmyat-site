name: rakmyat-production

# Separate from Phase 4.3 staging. Never start until host, database policy,
# credentials, backups, and deployment authorization have been approved.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rakmyat_prod}
      POSTGRES_USER: ${POSTGRES_USER:-rakmyat_bootstrap}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets: [postgres_bootstrap_password, app_db_password, migrator_db_password]
    volumes:
      - production_postgres_data:/var/lib/postgresql/data
      - ./docker/production/10-create-roles.sh:/docker-entrypoint-initdb.d/10-create-roles.sh:ro
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 1g
    cpus: 2
    pids_limit: 150
    stop_grace_period: 60s
    logging: &bounded_logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  migrate:
    image: ${RAKMYAT_MIGRATOR_IMAGE:-rakmyat-migrator:release-candidate}
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL_FILE: /run/secrets/migration_database_url
      DATABASE_SSL: ${DATABASE_SSL:-false}
    secrets: [migration_database_url]
    command: ["node", "--experimental-strip-types", "scripts/migrate.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [database]
    mem_limit: 384m
    cpus: 1
    pids_limit: 100
    logging: *bounded_logs

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        ROBOTS_INDEXING_ENABLED: ${ROBOTS_INDEXING_ENABLED:-false}
        NEXT_DEPLOYMENT_ID: ${NEXT_DEPLOYMENT_ID:?Set a unique deployment identifier before building}
    image: ${RAKMYAT_IMAGE:-rakmyat-web:release-candidate}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL_FILE: /run/secrets/app_database_url
      MEDIA_ROOT: /data/uploads
      DATABASE_SSL: ${DATABASE_SSL:-false}
      RATE_LIMIT_SECRET_FILE: /run/secrets/rate_limit_secret
      SMTP_HOST: ${SMTP_HOST:-smtp.hostinger.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-info@rakmyat.online}
      SMTP_PASS_FILE: /run/secrets/smtp_password
      SMTP_FROM: ${SMTP_FROM:-info@rakmyat.online}
      INQUIRY_NOTIFICATION_TO: ${INQUIRY_NOTIFICATION_TO:-yoseabdallah866@gmail.com}
      TRUSTED_CLIENT_IP_HEADER: ${TRUSTED_CLIENT_IP_HEADER:-x-real-ip}
      CONTACT_ALLOWED_ORIGINS: https://${PRODUCTION_HOSTNAME}
      INQUIRY_RATE_LIMIT_15M_MAX: ${INQUIRY_RATE_LIMIT_15M_MAX:-3}
      INQUIRY_RATE_LIMIT_24H_MAX: ${INQUIRY_RATE_LIMIT_24H_MAX:-10}
      ROBOTS_INDEXING_ENABLED: ${ROBOTS_INDEXING_ENABLED:-false}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
      NODE_OPTIONS: --max-old-space-size=1024
      OUTBOX_WORKER_SECRET_FILE: /run/secrets/outbox_worker_secret
      OUTBOX_MAX_ATTEMPTS: "5"
    secrets: [app_database_url, rate_limit_secret, smtp_password, outbox_worker_secret]
    volumes:
      - production_media:/data/uploads
    expose: ["3000"]
    networks: [database, application, ingress, smtp_egress]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=96m"
      - "/app/.next/cache:rw,noexec,nosuid,size=256m,uid=10001,gid=10001"
    mem_limit: 1536m
    cpus: 2
    pids_limit: 200
    stop_grace_period: 30s
    logging: *bounded_logs

  email-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        ROBOTS_INDEXING_ENABLED: ${ROBOTS_INDEXING_ENABLED:-false}
        NEXT_DEPLOYMENT_ID: ${NEXT_DEPLOYMENT_ID:?Set a unique deployment identifier before building}
    image: ${RAKMYAT_IMAGE:-rakmyat-web:release-candidate}
    restart: unless-stopped
    init: true
    command: ["node", "scripts/outbox-worker.mjs"]
    environment:
      OUTBOX_WORKER_URL: http://web:3000/api/internal/outbox
      OUTBOX_WORKER_SECRET_FILE: /run/secrets/outbox_worker_secret
      OUTBOX_WORKER_INTERVAL_MS: "10000"
    secrets: [outbox_worker_secret]
    networks: [application]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:fs').stat('/tmp/outbox-worker-heartbeat',(e,s)=>process.exit(!e&&Date.now()-s.mtimeMs<30000?0:1))"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 80
    stop_grace_period: 15s
    logging: *bounded_logs

  edge:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      PRODUCTION_HOSTNAME: ${PRODUCTION_HOSTNAME:?Set the owner-approved public hostname in deployment/production.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - production_caddy_data:/data
      - production_caddy_config:/config
    networks: [ingress, certificate_egress]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/config/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 60
    stop_grace_period: 30s
    logging: *bounded_logs

  admin-provision:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    environment:
      DATABASE_URL_FILE: /run/secrets/app_database_url
      DATABASE_SSL: ${DATABASE_SSL:-false}
    secrets: [app_database_url]
    command: ["node", "--experimental-strip-types", "scripts/create-admin.ts"]
    networks: [database]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 384m
    cpus: 1
    pids_limit: 100
    logging: *bounded_logs

secrets:
  postgres_bootstrap_password:
    file: ./.production-secrets/postgres_bootstrap_password
  app_db_password:
    file: ./.production-secrets/app_db_password
  migrator_db_password:
    file: ./.production-secrets/migrator_db_password
  app_database_url:
    file: ./.production-secrets/app_database_url
  migration_database_url:
    file: ./.production-secrets/migration_database_url
  rate_limit_secret:
    file: ./.production-secrets/rate_limit_secret
  smtp_password:
    file: ./.production-secrets/smtp_password
  outbox_worker_secret:
    file: ./.production-secrets/outbox_worker_secret

volumes:
  production_postgres_data:
    name: rakmyat_production_postgres_data
  production_media:
    name: rakmyat_production_media
  production_caddy_data:
    name: rakmyat_production_caddy_data
  production_caddy_config:
    name: rakmyat_production_caddy_config

networks:
  database:
    name: rakmyat_production_database
    internal: true
  application:
    name: rakmyat_production_application
    internal: true
  ingress:
    name: rakmyat_production_ingress
    internal: true
  smtp_egress:
    name: rakmyat_production_smtp_egress
    driver: bridge
  certificate_egress:
    name: rakmyat_production_certificate_egress
    driver: bridge
